name: ScreenGrab
options:
  bundleIdPrefix: de.vanille
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ScreenGrab:
    path: ..
  CornucopiaCore:
    url: https://github.com/Cornucopia-Swift/CornucopiaCore
    branch: master

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  ScreenGrab:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/ScreenGrab.xcconfig
      Release: Config/ScreenGrab.xcconfig
    sources:
      - path: ScreenGrab
    dependencies:
      - package: ScreenGrab
        product: ScreenGrabKit
      - package: CornucopiaCore
        product: CornucopiaCore
    info:
      path: ScreenGrab/Resources/Info.plist
      properties:
        CFBundleDisplayName: ScreenGrab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleLocalizations: [en, de]
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.vanille.ScreenGrab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Create Shark Resources
        basedOnDependencyAnalysis: false
        script: |
          unset SDKROOT
          /opt/homebrew/bin/shark "$PROJECT_FILE_PATH" "$PROJECT_DIR/ScreenGrab/Resources/Shark.swift" --target ScreenGrab --framework swiftui --name R --deps /tmp/deps-screengrab.d
        outputFiles:
          - $(SRCROOT)/ScreenGrab/Resources/Shark.swift
    postCompileScripts:
      - name: Stamp build number from git
        basedOnDependencyAnalysis: false
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null) || exit 0
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
